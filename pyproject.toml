[project]
name = "diversity-combining"
version = "1.0.0"
description = "Code for Diversity Combining for Multi-Path LLM Reasoning (NeurIPS 2026)"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.13.0",
  "datasets==4.6.0",
  "matplotlib==3.10.8",
  "numpy==2.4.2",
  "pandas==3.0.1",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "torch==2.10.0",
  "tqdm==4.67.3",
  "transformers==5.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diversity_combining", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
